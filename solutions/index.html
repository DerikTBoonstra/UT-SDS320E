<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions - SDS320E</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .password-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #667eea;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        .error {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h1>Solutions</h1>
        <p>Enter the password to access solutions:</p>
        <input type="password" id="passwordInput" placeholder="Password" />
        <button onclick="checkPassword()">Access</button>
        <div id="error"></div>
    </div>

    <script>
        const correctPassword = "your_password_here"; // CHANGE THIS
        
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('error');
            
            if (input === correctPassword) {
                window.location.href = 'SDS320E_1_Descriptive_Statistics.html';
            } else {
                errorDiv.textContent = 'Incorrect password. Try again.';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
